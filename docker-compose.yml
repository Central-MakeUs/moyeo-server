services:
  app:
    image: ${MOYEO_IMAGE}
    container_name: moyeo-server
    restart: unless-stopped
    # TODO: Stop publishing 8080 after the dev frontend and Apple login use HTTPS.
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ${LOG_DIR:-./logs}:/app/logs
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health | grep -q OK"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2.11.4-alpine
    container_name: moyeo-caddy
    restart: unless-stopped
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${DEV_API_DOMAIN:-3-35-119-70.sslip.io}
      - --to
      - app:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: moyeo-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: moyeo
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=64M
      - --max-connections=20
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${DB_USERNAME} -p${DB_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
  caddy-data:
    name: moyeo-caddy-data
    external: true
  caddy-config:
    name: moyeo-caddy-config
    external: true
