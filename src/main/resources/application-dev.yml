spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

server:
  forward-headers-strategy: framework

logging:
  file:
    path: /app/logs

moyeo:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://moyeo-web.vercel.app,https://moyeo-dev.vercel.app,http://localhost:3000,http://localhost:5173}
    allowed-origin-patterns:
      - https://moyeo-*-hyeonjirohs-projects.vercel.app
  oauth:
    apple:
      redirect-uris:
        dev: ${APPLE_OAUTH_REDIRECT_URI_DEV:${APPLE_REDIRECT_URI:https://moyeo-dev.vercel.app/auth/callback/apple}}
        prod: ${APPLE_OAUTH_REDIRECT_URI_PROD:https://moyeo-web.vercel.app/auth/callback/apple}
    kakao:
      redirect-uris:
        local: ${KAKAO_OAUTH_REDIRECT_URI_LOCAL:http://localhost:3000/auth/callback/kakao}
        dev: ${KAKAO_OAUTH_REDIRECT_URI_DEV:${KAKAO_OAUTH_REDIRECT_URI:https://moyeo-dev.vercel.app/auth/callback/kakao}}
        prod: ${KAKAO_OAUTH_REDIRECT_URI_PROD:https://moyeo-web.vercel.app/auth/callback/kakao}
