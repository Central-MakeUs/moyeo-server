spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none

logging:
  file:
    path: /app/logs

moyeo:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://moyeo-web.vercel.app,http://192.168.219.59:3000}
  oauth:
    apple:
      redirect-uris:
        dev: ${APPLE_OAUTH_REDIRECT_URI_DEV:https://moyeo-dev.vercel.app/auth/callback/apple}
        prod: ${APPLE_OAUTH_REDIRECT_URI_PROD:${APPLE_REDIRECT_URI:https://moyeo-web.vercel.app/auth/callback/apple}}
    kakao:
      redirect-uris:
        local: ${KAKAO_OAUTH_REDIRECT_URI_LOCAL:http://localhost:3000/auth/callback/kakao}
        dev: ${KAKAO_OAUTH_REDIRECT_URI_DEV:https://moyeo-dev.vercel.app/auth/callback/kakao}
        prod: ${KAKAO_OAUTH_REDIRECT_URI_PROD:${KAKAO_OAUTH_REDIRECT_URI:https://moyeo-web.vercel.app/auth/callback/kakao}}
