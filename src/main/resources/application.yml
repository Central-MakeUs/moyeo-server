spring:
  application:
    name: moyeo-server
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [traceId:%X{traceId}]"

moyeo:
  jwt:
    access-token-validity-seconds: 86400
  oauth:
    apple:
      enabled: ${APPLE_OAUTH_ENABLED:false}
      client-id: ${APPLE_CLIENT_ID:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key-base64: ${APPLE_PRIVATE_KEY_BASE64:}
      redirect-uris:
        dev: ${APPLE_OAUTH_REDIRECT_URI_DEV:${APPLE_REDIRECT_URI:https://moyeo-dev.vercel.app/auth/callback/apple}}
        prod: ${APPLE_OAUTH_REDIRECT_URI_PROD:https://moyeo-web.vercel.app/auth/callback/apple}
      token-uri: https://appleid.apple.com/auth/token
      revoke-uri: https://appleid.apple.com/auth/revoke
      jwks-uri: https://appleid.apple.com/auth/keys
      connect-timeout: 2s
      read-timeout: 3s
      jwks-cache-ttl: 1h
    apple-token-storage:
      encryption-key-base64: ${APPLE_REFRESH_TOKEN_ENCRYPTION_KEY_BASE64:}
    kakao:
      enabled: ${KAKAO_OAUTH_ENABLED:false}
      rest-api-key: ${KAKAO_OAUTH_REST_API_KEY:}
      client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
      admin-key: ${KAKAO_OAUTH_ADMIN_KEY:}
      redirect-uris:
        local: ${KAKAO_OAUTH_REDIRECT_URI_LOCAL:http://localhost:3000/auth/callback/kakao}
        dev: ${KAKAO_OAUTH_REDIRECT_URI_DEV:${KAKAO_OAUTH_REDIRECT_URI:https://moyeo-dev.vercel.app/auth/callback/kakao}}
        prod: ${KAKAO_OAUTH_REDIRECT_URI_PROD:https://moyeo-web.vercel.app/auth/callback/kakao}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      unlink-uri: https://kapi.kakao.com/v1/user/unlink
      connect-timeout: 2s
      read-timeout: 3s
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:3000
      - http://127.0.0.1:5173
    allowed-origin-patterns: []
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
    exposed-headers:
      - X-Trace-Id
    max-age-seconds: 3600
  departure-place-search:
    base-url: https://dapi.kakao.com
    rest-api-key: ${KAKAO_LOCAL_REST_API_KEY:}
    connect-timeout: 2s
    read-timeout: 3s
  meeting-cover:
    bucket: ${MEETING_COVER_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    cleanup-retry-delay: ${MEETING_COVER_CLEANUP_RETRY_DELAY:5m}
    max-upload-size: 5MB
    max-width: 1280
    max-height: 720
    jpeg-quality: 0.85
