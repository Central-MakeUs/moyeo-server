name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

jobs:
  deploy:
    if: github.repository == 'ohujj/MOYEO'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy-app-image.sh scripts/retain-app-images.sh scripts/rollback-dev.sh
          bash scripts/test-deploy-app-image.sh

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew bootJar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2 with SSM
        env:
          MOYEO_IMAGE: ${{ steps.image.outputs.image_uri }}
          AWS_REGION: ${{ env.AWS_REGION }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          SPRING_PROFILES_ACTIVE: dev
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          set -euo pipefail
          export ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          app_dir = os.environ["EC2_APP_DIR"]
          new_image = os.environ["MOYEO_IMAGE"]
          image_repository = new_image.rsplit(":", 1)[0]
          compose_base64 = base64.b64encode(
              Path("docker-compose.yml").read_bytes()
          ).decode("ascii")
          caddyfile_base64 = base64.b64encode(
              Path("Caddyfile").read_bytes()
          ).decode("ascii")
          cleanup_base64 = base64.b64encode(
              Path("scripts/retain-app-images.sh").read_bytes()
          ).decode("ascii")
          deploy_base64 = base64.b64encode(
              Path("scripts/deploy-app-image.sh").read_bytes()
          ).decode("ascii")
          rollback_base64 = base64.b64encode(
              Path("scripts/rollback-dev.sh").read_bytes()
          ).decode("ascii")
          commands = [
              "set -e",
              f"mkdir -p '{app_dir}'",
              f"mkdir -p '{app_dir}/logs'",
              f"test -f '{app_dir}/.env'",
              f"printf '%s' '{compose_base64}' | base64 --decode > "
              f"'{app_dir}/docker-compose.yml'",
              f"printf '%s' '{caddyfile_base64}' | base64 --decode > "
              f"'{app_dir}/Caddyfile'",
              f"printf '%s' '{cleanup_base64}' | base64 --decode > "
              f"'{app_dir}/retain-app-images.sh'",
              f"printf '%s' '{deploy_base64}' | base64 --decode > "
              f"'{app_dir}/deploy-app-image.sh'",
              f"printf '%s' '{rollback_base64}' | base64 --decode > "
              f"'{app_dir}/rollback-dev.sh'",
              f"chmod 750 '{app_dir}/deploy-app-image.sh' "
              f"'{app_dir}/retain-app-images.sh' "
              f"'{app_dir}/rollback-dev.sh'",
              f"grep -q '^APP_PORT=' '{app_dir}/.env' && sed -i 's|^APP_PORT=.*|APP_PORT={os.environ['APP_PORT']}|' '{app_dir}/.env' || echo 'APP_PORT={os.environ['APP_PORT']}' >> '{app_dir}/.env'",
              f"grep -q '^SPRING_PROFILES_ACTIVE=' '{app_dir}/.env' && sed -i 's|^SPRING_PROFILES_ACTIVE=.*|SPRING_PROFILES_ACTIVE={os.environ['SPRING_PROFILES_ACTIVE']}|' '{app_dir}/.env' || echo 'SPRING_PROFILES_ACTIVE={os.environ['SPRING_PROFILES_ACTIVE']}' >> '{app_dir}/.env'",
              f"aws ecr get-login-password --region '{os.environ['AWS_REGION']}' | docker login --username AWS --password-stdin '{os.environ['ECR_REGISTRY']}'",
              f"cd '{app_dir}'",
              "docker volume inspect moyeo-caddy-data >/dev/null 2>&1 || docker volume create moyeo-caddy-data",
              "docker volume inspect moyeo-caddy-config >/dev/null 2>&1 || docker volume create moyeo-caddy-config",
              "docker compose config --quiet",
              f"'{app_dir}/deploy-app-image.sh' '{app_dir}' "
              f"'{image_repository}' '{new_image}'",
          ]

          with open("/tmp/deploy-command.json", "w", encoding="utf-8") as file:
              json.dump({"commands": commands}, file)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy Moyeo dev server from GitHub Actions" \
            --parameters file:///tmp/deploy-command.json \
            --query "Command.CommandId" \
            --output text)

          COMMAND_STATUS=""
          for attempt in $(seq 1 45); do
            COMMAND_STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)
            case "$COMMAND_STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac
            sleep 5
          done

          if [ "$COMMAND_STATUS" != "Success" ]; then
            echo "Timed out waiting for the EC2 deployment command." >&2
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
              --output json || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
            --output json
